<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOIR · Obsidian Art Gallery</title>
  <script>
    (function () {
      window.__NOIR = { moduleLoaded: false, last: 'booting' };
      function paint(msg) {
        window.__NOIR.last = msg;
        try {
          var l = document.getElementById('loader');
          var s = document.getElementById('loadMsg');
          var isErr = msg.indexOf('\u274C') === 0;
          if (l && isErr) { l.classList.remove('done'); l.style.opacity = '1'; l.style.pointerEvents = 'auto'; l.style.display = 'flex'; }
          if (s) { s.textContent = msg; s.style.color = isErr ? '#ff6b6b' : ''; }
        } catch (e) {}
        try { console.log('[NOIR] ' + msg); } catch (e) {}
      }
      window.__noirPaint = paint;
      window.addEventListener('error', function (e) {
        paint('\u274C JS error: ' + (e.message || 'unknown') + (e.filename ? '  @ ' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        paint('\u274C Rejection: ' + (r && r.message ? r.message : String(r)));
      });
      setTimeout(function () {
        if (!window.__NOIR.moduleLoaded) {
          paint('\u274C Frontend module never loaded (last: ' + window.__NOIR.last + ')');
        }
      }, 8000);
    })();
  </script>
</head>
<body>
  <div id="titlebar">
    <div class="tb-drag"></div>
    <div class="tb-controls">
      <button id="tb-min" title="Minimize">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button id="tb-max" title="Maximize">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
      </button>
      <button id="tb-close" title="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div id="stage"></div>
  <div id="vignette"></div>

  <div id="loader">
    <div class="loader-mark">N O I R</div>
    <div class="bar"><i></i></div>
    <div class="sub" id="loadMsg">Hanging the collection…</div>
  </div>

  <div id="topbar">
    <div class="brand">NOIR<em>OBSIDIAN GALLERY</em></div>
    <div id="controls-right">
      <div class="seg" id="modeSeg">
        <button data-mode="ring" class="active">Carousel</button>
        <button data-mode="wall">Gallery Wall</button>
        <button data-mode="grid">Zero-G</button>
      </div>
      <button id="uploadBtn">+ Upload Art</button>
    </div>
  </div>

  <div id="tools">
    <button class="tbtn" id="capBtn" title="Save this view">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <button class="tbtn" id="shufBtn" title="Rearrange collection">
      <svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4m0 0-3-3m3 3-3 3M3 17h4l2.5-2.5M13.5 9.5 17 7h4m0 0-3-3m3 3-3 3"/></svg>
    </button>
    <button class="tbtn" id="fsBtn" title="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="tbtn" id="zoomInBtn" title="Zoom In">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6"/></svg>
    </button>
    <button class="tbtn" id="zoomOutBtn" title="Zoom Out">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6"/></svg>
    </button>
    <div id="lightWrap">
      <input type="range" id="mood" min="0" max="100" value="50">
      <label>Light</label>
    </div>
  </div>

  <div id="hint">Drag to orbit · Scroll or pinch to zoom · Tap an artwork to focus</div>

  <div id="backdrop"></div>
  <div id="modal">
    <div class="row">
      <img id="mImg" alt="">
      <div>
        <h2 id="mTitle"></h2>
        <div class="meta" id="mMeta"></div>
      </div>
    </div>
    <p class="desc" id="mDesc"></p>
    <div class="actions">
      <button class="mbtn gold" id="mClose">Return to Gallery</button>
      <div class="nav">
        <button class="mbtn" id="mPrev" title="Previous">&#8249;</button>
        <button class="mbtn" id="mNext" title="Next">&#8250;</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
