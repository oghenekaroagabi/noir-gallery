<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOIR</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #08080C;
    overflow: hidden;
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
    color: #EDEAE2;
  }
  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
  }
  .mark {
    font-size: 52px;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    color: #C9A227;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5 }
    50% { opacity: 1 }
  }
  .bar {
    width: 220px;
    height: 1px;
    background: rgba(201, 162, 39, 0.18);
    position: relative;
    overflow: hidden;
  }
  .bar i {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 40%;
    background: #C9A227;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0% { left: -40% }
    100% { left: 100% }
  }
  .sub {
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #9a97a3;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">N O I R</div>
    <div class="bar"><i></i></div>
    <div class="sub" id="msg">Hanging the collection…</div>
  </div>
</body>
</html>
