[package]
name = "noir-gallery"
version = "1.0.0"
description = "NOIR · Obsidian Art Gallery"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "dialog-open",
  "dialog-save",
  "fs-all",
  "shell-open",
  "window-state",
  "global-shortcut",
  "clipboard-manager"
] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.24", features = ["png", "jpeg"] }
imageproc = "0.24"
rusttype = "0.12"
base64 = "0.21"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0"
tokio = { version = "1.0", features = ["fs", "macros"] }
sentry = { version = "0.34", features = ["tauri", "backtrace"] }
once_cell = "1.19"